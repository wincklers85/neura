services:
  - type: web
    name: neura-cloud
    runtime: docker
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: APP_PASSWORD
        sync: false
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: LLM_API_BASE
        value: https://api.openai.com/v1
      - key: LLM_API_KEY
        sync: false
      - key: MODEL_NAME
        value: gpt-4.1-mini
      - key: VISION_MODEL
        value: gpt-4.1-mini
      - key: LLM_TIMEOUT
        value: "180"
      - key: LLM_RETRIES
        value: "2"
      - key: LLM_MAX_CONCURRENT
        value: "3"
      - key: MAX_HISTORY
        value: "24"
      - key: MAX_MEMORIES
        value: "10"
      - key: WEB_WORKERS
        value: "1"
      - key: TAVILY_API_KEY
        sync: false
    disk:
      name: neura-data
      mountPath: /var/data
      sizeGB: 2
